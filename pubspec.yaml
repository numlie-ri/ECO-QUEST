name: eco_quest
description: ECO QUEST - Petualangan Penyelamat Bumi (game platformer Flutter).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Tidak ada aset gambar/audio: semua grafis digambar dengan CustomPainter
  # dan semua suara dihasilkan secara programatik (lihat lib/core/audio.dart).